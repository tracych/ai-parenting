<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Quest 🦊</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; font-family: 'Comic Sans MS', 'Chalkboard SE', system-ui, sans-serif; }
  body {
    background: linear-gradient(135deg, #87CEEB 0%, #FFE4B5 100%);
    overflow: hidden;
    user-select: none;
  }
  #app { width: 100%; height: 100vh; display: flex; align-items: center; justify-content: center; }
  .screen {
    width: 100%; max-width: 900px; height: 100%; max-height: 100vh;
    padding: 20px; display: flex; flex-direction: column; align-items: center;
    overflow-y: auto;
  }
  h1 { font-size: clamp(2rem, 6vw, 3.5rem); color: #FF6B35; text-shadow: 3px 3px 0 #fff; margin: 10px 0; text-align: center; }
  h2 { font-size: clamp(1.3rem, 4vw, 2rem); color: #2E86AB; text-align: center; margin: 10px 0; }
  .big-btn {
    font-family: inherit;
    font-size: clamp(1.2rem, 3vw, 1.8rem);
    padding: 18px 32px;
    border: 4px solid #fff;
    border-radius: 24px;
    cursor: pointer;
    background: #FF6B35;
    color: white;
    box-shadow: 0 6px 0 #c44a1f, 0 8px 16px rgba(0,0,0,0.2);
    transition: transform 0.1s, box-shadow 0.1s;
    margin: 8px;
    font-weight: bold;
  }
  .big-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #c44a1f, 0 4px 8px rgba(0,0,0,0.2); }
  .big-btn.green { background: #4CAF50; box-shadow: 0 6px 0 #2e7031, 0 8px 16px rgba(0,0,0,0.2); }
  .big-btn.green:active { box-shadow: 0 2px 0 #2e7031, 0 4px 8px rgba(0,0,0,0.2); }
  .big-btn.blue { background: #2E86AB; box-shadow: 0 6px 0 #1c5670, 0 8px 16px rgba(0,0,0,0.2); }
  .big-btn.purple { background: #9B59B6; box-shadow: 0 6px 0 #5e3470, 0 8px 16px rgba(0,0,0,0.2); }
  .big-btn.gray { background: #888; box-shadow: 0 6px 0 #555, 0 8px 16px rgba(0,0,0,0.2); font-size: 1rem; padding: 10px 20px; }

  .hero { font-size: clamp(4rem, 12vw, 7rem); animation: bounce 2s ease-in-out infinite; }
  @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

  .worlds { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; width: 100%; max-width: 600px; margin-top: 20px; }
  .world-card {
    background: white; border-radius: 24px; padding: 20px; text-align: center;
    cursor: pointer; border: 5px solid transparent;
    box-shadow: 0 6px 0 rgba(0,0,0,0.15), 0 8px 16px rgba(0,0,0,0.1);
    transition: transform 0.15s;
  }
  .world-card:active { transform: scale(0.97); }
  .world-card.locked { opacity: 0.5; cursor: not-allowed; }
  .world-emoji { font-size: clamp(3rem, 8vw, 5rem); }
  .world-name { font-size: clamp(1rem, 3vw, 1.4rem); font-weight: bold; color: #333; margin-top: 8px; }
  .world-stars { font-size: 1.5rem; margin-top: 6px; }

  .question-box {
    background: white; border-radius: 32px; padding: 30px; margin: 20px 0;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    width: 100%; max-width: 700px; text-align: center;
  }
  .question-text { font-size: clamp(2rem, 7vw, 4rem); color: #333; margin: 20px 0; font-weight: bold; }
  .word-problem { font-size: clamp(1.1rem, 3.5vw, 1.6rem); color: #555; line-height: 1.5; margin: 20px 0; }
  .visual-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 16px 0; min-height: 60px; }
  .visual-item { font-size: clamp(1.8rem, 5vw, 2.8rem); animation: pop 0.3s ease-out; }
  @keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }
  .visual-divider { font-size: clamp(2rem, 6vw, 3rem); color: #FF6B35; align-self: center; padding: 0 10px; font-weight: bold; }
  .visual-group { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px; background: #FFF8E7; border-radius: 16px; border: 3px dashed #FFB347; }

  .answer-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; max-width: 400px; margin: 0 auto; }
  .answer-grid.four-col { grid-template-columns: repeat(2, 1fr); }
  .answer-btn {
    font-family: inherit;
    font-size: clamp(1.5rem, 5vw, 2.5rem);
    padding: 20px;
    border: 4px solid #fff;
    border-radius: 20px;
    background: #4CAF50;
    color: white;
    cursor: pointer;
    box-shadow: 0 6px 0 #2e7031;
    font-weight: bold;
    min-height: 70px;
  }
  .answer-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #2e7031; }
  .answer-btn.correct { background: #4CAF50; animation: shake-correct 0.5s; }
  .answer-btn.wrong { background: #E74C3C; box-shadow: 0 6px 0 #962d22; animation: shake-wrong 0.4s; }
  @keyframes shake-correct { 0%,100%{transform:scale(1);} 50%{transform:scale(1.15);} }
  @keyframes shake-wrong { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-8px);} 75%{transform:translateX(8px);} }

  .picture-choice {
    background: #FFF8E7; border: 4px solid #FFB347; border-radius: 20px;
    padding: 16px; cursor: pointer; min-height: 100px;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px;
    font-size: clamp(1.4rem, 4vw, 2rem);
  }
  .picture-choice:active { transform: scale(0.95); }
  .picture-choice.correct { background: #C8E6C9; border-color: #4CAF50; }
  .picture-choice.wrong { background: #FFCDD2; border-color: #E74C3C; }

  .top-bar {
    width: 100%; display: flex; justify-content: space-between; align-items: center;
    padding: 10px 20px; background: rgba(255,255,255,0.7); border-radius: 16px;
    margin-bottom: 12px;
  }
  .stars-display { font-size: 1.5rem; font-weight: bold; color: #FFA500; }
  .progress-bar { background: #ddd; border-radius: 10px; height: 16px; width: 150px; overflow: hidden; }
  .progress-fill { background: #4CAF50; height: 100%; transition: width 0.3s; border-radius: 10px; }

  .feedback {
    font-size: clamp(2rem, 6vw, 3rem); margin: 16px 0; min-height: 60px; font-weight: bold;
  }
  .feedback.good { color: #4CAF50; animation: pop 0.4s; }
  .feedback.bad { color: #E74C3C; }

  .reward-screen { text-align: center; }
  .stars-earned { font-size: clamp(3rem, 10vw, 5rem); animation: pop 0.6s; }

  .dashboard {
    background: white; border-radius: 20px; padding: 20px; margin: 10px;
    width: 100%; max-width: 700px;
  }
  .mastery-row { display: flex; align-items: center; gap: 10px; padding: 8px; border-bottom: 1px solid #eee; }
  .mastery-fact { font-family: monospace; font-size: 1.1rem; min-width: 80px; }
  .mastery-bar { flex: 1; background: #eee; height: 18px; border-radius: 9px; overflow: hidden; }
  .mastery-fill { height: 100%; transition: width 0.5s; }
  .small-text { font-size: 0.9rem; color: #666; text-align: center; margin: 8px; }

  .tap-hint {
    background: #FFF8E7; border: 3px dashed #FFB347; border-radius: 16px;
    padding: 12px; margin: 10px 0; font-size: clamp(1rem, 3vw, 1.3rem); color: #555;
  }

  /* Touch counters for visual problems */
  .countable { cursor: pointer; transition: transform 0.1s; }
  .countable.counted { filter: drop-shadow(0 0 8px #4CAF50); transform: scale(1.1); }
</style>
</head>
<body>
<div id="app"></div>

<script>
// =========================================================================
// MATH QUEST — Math game for ~6yo with built-in understanding validation
// =========================================================================
//
// Validation strategy (the "do they really understand?" part):
//   1. MULTI-REPRESENTATION: a math fact is "mastered" only after the child
//      answers it correctly in >=2 of 3 formats (numeric / visual / word).
//      Recognizing one form alone could be memorization or guessing.
//   2. CONCEPT PROBES: ~30% of the time after a correct numeric answer, we
//      ask a follow-up "which picture shows this?" with 4 visual options.
//      Reveals kids who picked the right number without understanding.
//   3. INVERSE QUESTIONS: "? + 2 = 5" tests operation understanding, not
//      recitation. Mixed in at higher mastery levels.
//   4. PARENT DASHBOARD shows per-fact mastery and which formats the child
//      has demonstrated understanding in.
// =========================================================================

const STATE = {
  hero: '🦊',
  stars: 0,
  currentWorld: null,
  questionsInLevel: 0,
  correctInLevel: 0,
  mastery: {}, // key = "3+2", value = { numeric: 0, visual: 0, word: 0, attempts: 0, correct: 0 }
};

const WORLDS = {
  add: { emoji: '🌲', name: 'Plus Forest', op: '+', color: '#4CAF50' },
  sub: { emoji: '🕳️', name: 'Minus Cave', op: '−', color: '#9B59B6' },
  mul: { emoji: '🏰', name: 'Times Castle', op: '×', color: '#2E86AB' },
  div: { emoji: '🌊', name: 'Divide Sea', op: '÷', color: '#FF6B35' },
};

const ITEMS = ['🍎','🍌','⭐','🐠','🌸','🐝','🍓','🦋','🍊','🐞'];

// ---------------------------------------------------------------------------
// PERSISTENCE
// ---------------------------------------------------------------------------
function saveState() {
  try { localStorage.setItem('mathquest', JSON.stringify({
    stars: STATE.stars, mastery: STATE.mastery, hero: STATE.hero,
  })); } catch(e) {}
}
function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem('mathquest') || '{}');
    if (s.stars) STATE.stars = s.stars;
    if (s.mastery) STATE.mastery = s.mastery;
    if (s.hero) STATE.hero = s.hero;
  } catch(e) {}
}

// ---------------------------------------------------------------------------
// MASTERY TRACKING
// ---------------------------------------------------------------------------
function factKey(a, op, b) { return `${a}${op}${b}`; }

function recordAnswer(a, op, b, format, correct) {
  const k = factKey(a, op, b);
  if (!STATE.mastery[k]) STATE.mastery[k] = { numeric:0, visual:0, word:0, attempts:0, correct:0 };
  const m = STATE.mastery[k];
  m.attempts++;
  if (correct) {
    m.correct++;
    m[format] = Math.min(3, (m[format] || 0) + 1);
  } else {
    m[format] = Math.max(0, (m[format] || 0) - 1);
  }
  saveState();
}

// A fact is "mastered" when the kid has gotten it right in >=2 different formats
function isMastered(a, op, b) {
  const m = STATE.mastery[factKey(a, op, b)];
  if (!m) return false;
  let formatsKnown = 0;
  if (m.numeric >= 1) formatsKnown++;
  if (m.visual >= 1) formatsKnown++;
  if (m.word >= 1) formatsKnown++;
  return formatsKnown >= 2;
}

function masteryLevel(a, op, b) {
  // 0..3 — used to decide difficulty escalation
  const m = STATE.mastery[factKey(a, op, b)];
  if (!m) return 0;
  return Math.min(3, (m.numeric + m.visual + m.word) / 3);
}

// ---------------------------------------------------------------------------
// PROBLEM GENERATION (kid-appropriate ranges per operation)
// ---------------------------------------------------------------------------
function genProblem(worldKey) {
  const world = WORLDS[worldKey];
  let a, b, answer;
  if (worldKey === 'add') {
    // 1+1 to 9+9, biased toward smaller initially
    a = rand(1, 9); b = rand(1, 9); answer = a + b;
  } else if (worldKey === 'sub') {
    // result always >= 0, kid-friendly
    a = rand(2, 10); b = rand(1, a); answer = a - b;
  } else if (worldKey === 'mul') {
    // 1x1 to 5x5 — multiplication is hard for 6yo
    a = rand(1, 5); b = rand(1, 5); answer = a * b;
  } else if (worldKey === 'div') {
    // generate from multiplication so result is whole and small
    const q = rand(1, 5); b = rand(1, 5); a = q * b; answer = q;
  }
  return { a, b, op: world.op, answer, worldKey };
}

function rand(lo, hi) { return Math.floor(Math.random() * (hi - lo + 1)) + lo; }
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function genWrongAnswers(correct, count, max) {
  const wrong = new Set();
  while (wrong.size < count) {
    let delta = rand(-3, 3);
    if (delta === 0) delta = 1;
    const candidate = correct + delta;
    if (candidate >= 0 && candidate <= max && candidate !== correct) wrong.add(candidate);
  }
  return [...wrong];
}

// ---------------------------------------------------------------------------
// VISUAL RENDERING for problems
// ---------------------------------------------------------------------------
function visualForProblem(p, item) {
  // Returns HTML representing the problem visually
  const dot = item || ITEMS[rand(0, ITEMS.length - 1)];
  if (p.op === '+') {
    return `<div class="visual-row">
      <div class="visual-group">${dot.repeat(p.a)}</div>
      <div class="visual-divider">+</div>
      <div class="visual-group">${dot.repeat(p.b)}</div>
    </div>`;
  } else if (p.op === '−') {
    // show A items, with B "crossed out"
    let html = '';
    for (let i = 0; i < p.a; i++) {
      html += i < p.a - p.b
        ? `<span class="visual-item">${dot}</span>`
        : `<span class="visual-item" style="opacity:0.25;text-decoration:line-through;">${dot}</span>`;
    }
    return `<div class="visual-row"><div class="visual-group">${html}</div></div>`;
  } else if (p.op === '×') {
    // show A groups of B items each
    let groups = '';
    for (let i = 0; i < p.a; i++) {
      groups += `<div class="visual-group">${dot.repeat(p.b)}</div>`;
    }
    return `<div class="visual-row" style="gap:10px;">${groups}</div>
            <div class="small-text">${p.a} groups of ${p.b}</div>`;
  } else if (p.op === '÷') {
    // show A items split into B groups
    const perGroup = p.answer;
    let groups = '';
    for (let i = 0; i < p.b; i++) {
      groups += `<div class="visual-group">${dot.repeat(perGroup)}</div>`;
    }
    return `<div class="visual-row" style="gap:10px;">${groups}</div>
            <div class="small-text">${p.a} shared into ${p.b} groups</div>`;
  }
}

// ---------------------------------------------------------------------------
// WORD PROBLEMS
// ---------------------------------------------------------------------------
function wordProblem(p) {
  const things = [
    { plural: 'apples', singular: 'apple', emoji: '🍎', who: 'You' },
    { plural: 'stickers', singular: 'sticker', emoji: '⭐', who: 'Mia' },
    { plural: 'cookies', singular: 'cookie', emoji: '🍪', who: 'Leo' },
    { plural: 'crayons', singular: 'crayon', emoji: '🖍️', who: 'You' },
    { plural: 'fish', singular: 'fish', emoji: '🐠', who: 'Max' },
  ];
  const t = things[rand(0, things.length - 1)];
  if (p.op === '+') {
    return `${t.emoji} ${t.who} have <b>${p.a}</b> ${t.plural}, and got <b>${p.b}</b> more. How many now?`;
  } else if (p.op === '−') {
    return `${t.emoji} ${t.who} had <b>${p.a}</b> ${t.plural}, and gave away <b>${p.b}</b>. How many left?`;
  } else if (p.op === '×') {
    return `${t.emoji} There are <b>${p.a}</b> baskets, each with <b>${p.b}</b> ${t.plural}. How many ${t.plural} in all?`;
  } else if (p.op === '÷') {
    return `${t.emoji} There are <b>${p.a}</b> ${t.plural} to share equally with <b>${p.b}</b> friends. How many does each friend get?`;
  }
}

// ---------------------------------------------------------------------------
// SOUND (simple Web Audio for feedback)
// ---------------------------------------------------------------------------
let audioCtx = null;
function beep(freq, dur, type = 'sine') {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.value = 0.15;
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  } catch(e) {}
}
function soundCorrect() { beep(660, 0.12); setTimeout(() => beep(880, 0.18), 100); }
function soundWrong()   { beep(220, 0.25, 'square'); }
function soundStar()    { beep(880, 0.1); setTimeout(() => beep(1100, 0.1), 80); setTimeout(() => beep(1320, 0.2), 160); }

// ===========================================================================
// SCREENS
// ===========================================================================
const app = document.getElementById('app');

function render(html) { app.innerHTML = `<div class="screen">${html}</div>`; }

// ---------- WELCOME ----------
function screenWelcome() {
  render(`
    <h1>🦊 Math Quest 🦊</h1>
    <h2>Pick your buddy!</h2>
    <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:20px;margin:20px;">
      ${['🦊','🐼','🦁','🐸','🦄','🐶'].map(e => `
        <div class="hero" style="cursor:pointer;font-size:4rem;animation:none;" onclick="window.pickHero('${e}')">${e}</div>
      `).join('')}
    </div>
    <button class="big-btn green" onclick="window.go('map')">Start! ▶</button>
    ${STATE.stars > 0 ? `<div class="small-text">⭐ You have ${STATE.stars} stars</div>` : ''}
    <button class="big-btn gray" onclick="window.go('dashboard')">For Grown-Ups 👨‍👩‍👧</button>
  `);
}
window.pickHero = (e) => { STATE.hero = e; saveState(); screenWelcome(); };

// ---------- WORLD MAP ----------
function screenMap() {
  const totalMastered = Object.keys(STATE.mastery).filter(k => {
    const m = STATE.mastery[k];
    let f = 0;
    if (m.numeric >= 1) f++; if (m.visual >= 1) f++; if (m.word >= 1) f++;
    return f >= 2;
  }).length;
  render(`
    <div class="top-bar">
      <div class="hero" style="font-size:2.5rem;animation:none;">${STATE.hero}</div>
      <div class="stars-display">⭐ ${STATE.stars}</div>
    </div>
    <h1>Choose a World!</h1>
    <div class="worlds">
      ${Object.entries(WORLDS).map(([key, w]) => `
        <div class="world-card" onclick="window.go('level','${key}')">
          <div class="world-emoji">${w.emoji}</div>
          <div class="world-name">${w.name}</div>
          <div style="font-size:2rem;color:${w.color};font-weight:bold;">${w.op}</div>
          <div class="world-stars">${worldStarsDisplay(key)}</div>
        </div>
      `).join('')}
    </div>
    <div class="small-text">${totalMastered} math facts mastered! Keep going! 🎉</div>
    <button class="big-btn gray" onclick="window.go('dashboard')">For Grown-Ups</button>
  `);
}

function worldStarsDisplay(worldKey) {
  const op = WORLDS[worldKey].op;
  const masteredCount = Object.keys(STATE.mastery).filter(k => {
    if (!k.includes(op)) return false;
    return isMasteredKey(k);
  }).length;
  if (masteredCount >= 15) return '⭐⭐⭐';
  if (masteredCount >= 8) return '⭐⭐';
  if (masteredCount >= 3) return '⭐';
  return '✨';
}
function isMasteredKey(k) {
  const m = STATE.mastery[k];
  let f = 0;
  if (m.numeric >= 1) f++; if (m.visual >= 1) f++; if (m.word >= 1) f++;
  return f >= 2;
}

// ---------- LEVEL (sequence of questions) ----------
const QUESTIONS_PER_LEVEL = 5;

function screenLevel(worldKey) {
  STATE.currentWorld = worldKey;
  STATE.questionsInLevel = 0;
  STATE.correctInLevel = 0;
  nextQuestion();
}

function nextQuestion() {
  if (STATE.questionsInLevel >= QUESTIONS_PER_LEVEL) {
    return screenReward();
  }
  STATE.questionsInLevel++;
  // Choose format: numeric / visual / word — weight by what kid hasn't shown yet
  const formats = ['numeric', 'visual', 'word'];
  // For multiplication/division for 6yo, prefer visual & word
  const w = STATE.currentWorld;
  let weights;
  if (w === 'mul' || w === 'div') weights = { numeric: 1, visual: 3, word: 2 };
  else weights = { numeric: 2, visual: 2, word: 2 };
  const format = pickWeighted(formats, weights);
  const p = genProblem(w);
  if (format === 'numeric') return askNumeric(p);
  if (format === 'visual') return askVisual(p);
  if (format === 'word') return askWord(p);
}

function pickWeighted(arr, weightMap) {
  const total = arr.reduce((s, k) => s + (weightMap[k] || 1), 0);
  let r = Math.random() * total;
  for (const k of arr) {
    r -= (weightMap[k] || 1);
    if (r <= 0) return k;
  }
  return arr[0];
}

function topBar() {
  return `
    <div class="top-bar">
      <button class="big-btn gray" onclick="window.go('map')">🏠 Map</button>
      <div class="progress-bar"><div class="progress-fill" style="width:${(STATE.questionsInLevel-1)/QUESTIONS_PER_LEVEL*100}%"></div></div>
      <div class="stars-display">⭐ ${STATE.stars}</div>
    </div>`;
}

// ---------- ASK: NUMERIC ----------
function askNumeric(p) {
  const wrong = genWrongAnswers(p.answer, 3, p.op === '×' ? 30 : 20);
  const choices = shuffle([p.answer, ...wrong]);
  render(`
    ${topBar()}
    <div class="question-box">
      <div class="hero" style="font-size:3rem;animation:none;">${STATE.hero}</div>
      <div class="question-text">${p.a} ${p.op} ${p.b} = ?</div>
      <div class="answer-grid">
        ${choices.map(c => `<button class="answer-btn" data-c="${c}">${c}</button>`).join('')}
      </div>
      <div class="feedback" id="fb"></div>
    </div>
  `);
  document.querySelectorAll('.answer-btn').forEach(btn => {
    btn.onclick = () => handleAnswer(btn, +btn.dataset.c, p, 'numeric');
  });
}

// ---------- ASK: VISUAL ----------
function askVisual(p) {
  const wrong = genWrongAnswers(p.answer, 3, p.op === '×' ? 30 : 20);
  const choices = shuffle([p.answer, ...wrong]);
  render(`
    ${topBar()}
    <div class="question-box">
      <div class="tap-hint">👆 Count them!</div>
      ${visualForProblem(p)}
      <div class="question-text" style="font-size:2rem;">How many?</div>
      <div class="answer-grid">
        ${choices.map(c => `<button class="answer-btn" data-c="${c}">${c}</button>`).join('')}
      </div>
      <div class="feedback" id="fb"></div>
    </div>
  `);
  document.querySelectorAll('.answer-btn').forEach(btn => {
    btn.onclick = () => handleAnswer(btn, +btn.dataset.c, p, 'visual');
  });
}

// ---------- ASK: WORD PROBLEM ----------
function askWord(p) {
  const wrong = genWrongAnswers(p.answer, 3, p.op === '×' ? 30 : 20);
  const choices = shuffle([p.answer, ...wrong]);
  render(`
    ${topBar()}
    <div class="question-box">
      <div class="hero" style="font-size:2.5rem;animation:none;">${STATE.hero}</div>
      <div class="word-problem">${wordProblem(p)}</div>
      <div class="answer-grid">
        ${choices.map(c => `<button class="answer-btn" data-c="${c}">${c}</button>`).join('')}
      </div>
      <div class="feedback" id="fb"></div>
    </div>
  `);
  document.querySelectorAll('.answer-btn').forEach(btn => {
    btn.onclick = () => handleAnswer(btn, +btn.dataset.c, p, 'word');
  });
}

// ---------- ANSWER HANDLER ----------
function handleAnswer(btn, picked, p, format) {
  const correct = picked === p.answer;
  document.querySelectorAll('.answer-btn').forEach(b => b.disabled = true);
  const fb = document.getElementById('fb');
  if (correct) {
    btn.classList.add('correct');
    fb.className = 'feedback good';
    fb.textContent = ['Yes! 🎉', 'Great! ⭐', 'Awesome! 🌟', 'You got it! 🎊'][rand(0,3)];
    soundCorrect();
    STATE.stars++;
    STATE.correctInLevel++;
    recordAnswer(p.a, p.op, p.b, format, true);
    // CONCEPT PROBE: ~30% chance after numeric correct, ask "which picture matches?"
    // This is the key validation — proves they understand, not just guessed/memorized
    const shouldProbe = format === 'numeric' && Math.random() < 0.3 && p.op !== '÷';
    setTimeout(() => {
      if (shouldProbe) askConceptProbe(p);
      else nextQuestion();
    }, 1200);
  } else {
    btn.classList.add('wrong');
    fb.className = 'feedback bad';
    fb.textContent = `Try again! Answer: ${p.answer}`;
    soundWrong();
    recordAnswer(p.a, p.op, p.b, format, false);
    // Show the visual to teach the concept after a wrong answer
    setTimeout(() => showTeachMoment(p), 1500);
  }
}

// ---------- CONCEPT PROBE: validates understanding beyond the number ----------
function askConceptProbe(p) {
  // Build 4 picture choices; 1 matches the original problem, 3 are "almost"
  const dot = ITEMS[rand(0, ITEMS.length - 1)];
  const correct = visualForProblem(p, dot);
  // wrong ones: shuffle a/b, or off-by-one
  const distractors = [
    visualForProblem({ ...p, a: Math.max(1, p.a + 1), b: p.b }, dot),
    visualForProblem({ ...p, a: p.a, b: Math.max(1, p.b - 1) }, dot),
    visualForProblem({ ...p, a: Math.max(1, p.b), b: Math.max(1, p.a - 1) }, dot),
  ];
  const all = shuffle([
    { html: correct, isRight: true },
    ...distractors.map(h => ({ html: h, isRight: false })),
  ]);
  render(`
    ${topBar()}
    <div class="question-box">
      <h2 style="color:#9B59B6;">🔍 Show Me!</h2>
      <div class="word-problem">Which picture shows <b>${p.a} ${p.op} ${p.b}</b>?</div>
      <div class="answer-grid" style="grid-template-columns:repeat(2,1fr);max-width:600px;">
        ${all.map((c, i) => `<div class="picture-choice" data-i="${i}">${c.html}</div>`).join('')}
      </div>
      <div class="feedback" id="fb"></div>
    </div>
  `);
  document.querySelectorAll('.picture-choice').forEach(el => {
    el.onclick = () => {
      const i = +el.dataset.i;
      const isRight = all[i].isRight;
      document.querySelectorAll('.picture-choice').forEach(x => x.style.pointerEvents = 'none');
      el.classList.add(isRight ? 'correct' : 'wrong');
      const fb = document.getElementById('fb');
      if (isRight) {
        fb.className = 'feedback good'; fb.textContent = 'You really get it! 🌟';
        soundCorrect(); STATE.stars++;
        recordAnswer(p.a, p.op, p.b, 'visual', true);
      } else {
        fb.className = 'feedback bad'; fb.textContent = 'Look again next time!';
        soundWrong();
        // Don't penalize as wrong on the main fact — this is a bonus probe.
        // But mark visual format weaker so we'll re-test.
        recordAnswer(p.a, p.op, p.b, 'visual', false);
        // highlight the right one
        all.forEach((c, j) => {
          if (c.isRight) document.querySelector(`[data-i="${j}"]`).classList.add('correct');
        });
      }
      setTimeout(() => nextQuestion(), 1800);
    };
  });
}

// ---------- TEACH MOMENT after wrong answer ----------
function showTeachMoment(p) {
  render(`
    ${topBar()}
    <div class="question-box">
      <h2 style="color:#2E86AB;">Look! 👀</h2>
      <div class="question-text" style="font-size:2.2rem;">${p.a} ${p.op} ${p.b} = ${p.answer}</div>
      ${visualForProblem(p)}
      <button class="big-btn green" onclick="window.nextQ()">Got it! ▶</button>
    </div>
  `);
}
window.nextQ = () => nextQuestion();

// ---------- REWARD SCREEN ----------
function screenReward() {
  const stars = STATE.correctInLevel;
  let msg = 'Great try!';
  if (stars >= 5) msg = 'PERFECT! 🌟';
  else if (stars >= 4) msg = 'Amazing!';
  else if (stars >= 3) msg = 'Good job!';
  soundStar();
  render(`
    <div class="reward-screen">
      <h1>${msg}</h1>
      <div class="hero">${STATE.hero}</div>
      <div class="stars-earned">${'⭐'.repeat(stars)}${'☆'.repeat(QUESTIONS_PER_LEVEL - stars)}</div>
      <div style="font-size:1.5rem;margin:16px;">You got <b>${stars}/${QUESTIONS_PER_LEVEL}</b> right!</div>
      <button class="big-btn green" onclick="window.go('level','${STATE.currentWorld}')">Play Again ▶</button>
      <button class="big-btn blue" onclick="window.go('map')">🏠 World Map</button>
    </div>
  `);
}

// ---------- PARENT DASHBOARD ----------
function screenDashboard() {
  const facts = Object.entries(STATE.mastery).sort((a,b) => a[0].localeCompare(b[0]));
  const byOp = { '+':[], '−':[], '×':[], '÷':[] };
  facts.forEach(([k, m]) => {
    for (const op of Object.keys(byOp)) {
      if (k.includes(op)) { byOp[op].push([k, m]); break; }
    }
  });
  render(`
    <h1 style="font-size:2rem;">Parent Dashboard</h1>
    <div class="dashboard">
      <div class="small-text">
        <b>How mastery works:</b> A fact is "mastered" only when your child gets it right
        in <b>at least 2 different formats</b> (numeric, visual picture, or word problem).
        This filters out lucky guesses or rote memorization without understanding.
      </div>
      ${Object.entries(byOp).map(([op, items]) => items.length === 0 ? '' : `
        <h2 style="text-align:left;margin-top:16px;color:#2E86AB;">${op === '+' ? 'Addition' : op === '−' ? 'Subtraction' : op === '×' ? 'Multiplication' : 'Division'} (${op})</h2>
        ${items.map(([k, m]) => {
          const accuracy = m.attempts ? Math.round(m.correct / m.attempts * 100) : 0;
          let formats = 0;
          if (m.numeric >= 1) formats++;
          if (m.visual >= 1) formats++;
          if (m.word >= 1) formats++;
          const masteryPct = (formats / 3) * 100;
          const color = formats >= 2 ? '#4CAF50' : formats === 1 ? '#FFA500' : '#E74C3C';
          return `
            <div class="mastery-row">
              <div class="mastery-fact">${k}</div>
              <div class="mastery-bar"><div class="mastery-fill" style="width:${masteryPct}%;background:${color};"></div></div>
              <div style="font-size:0.85rem;color:#666;min-width:140px;">
                ${formats >= 2 ? '✅ Mastered' : formats === 1 ? '🟡 Learning' : '🔴 Needs work'}
                <br>
                <span style="font-size:0.75rem;">N:${m.numeric} V:${m.visual} W:${m.word} · ${accuracy}%</span>
              </div>
            </div>
          `;
        }).join('')}
      `).join('')}
      ${facts.length === 0 ? '<div class="small-text">No data yet — play some levels!</div>' : ''}
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">
      <button class="big-btn blue" onclick="window.go('map')">← Back</button>
      <button class="big-btn gray" onclick="window.resetProgress()">Reset Progress</button>
    </div>
  `);
}
window.resetProgress = () => {
  if (confirm('Reset all stars and mastery?')) {
    STATE.stars = 0; STATE.mastery = {}; saveState(); screenDashboard();
  }
};

// ---------- ROUTER ----------
window.go = (screen, arg) => {
  if (screen === 'welcome') screenWelcome();
  else if (screen === 'map') screenMap();
  else if (screen === 'level') screenLevel(arg);
  else if (screen === 'dashboard') screenDashboard();
};

// BOOT
loadState();
screenWelcome();
</script>
</body>
</html>
