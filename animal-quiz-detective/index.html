<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animal Quiz Detective 🕵️</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; font-family: 'Comic Sans MS', 'Chalkboard SE', system-ui, sans-serif; }
  body {
    background: linear-gradient(135deg, #ffe9a8 0%, #b5e8c8 100%);
    overflow: hidden;
    user-select: none;
  }
  #app { width: 100%; height: 100vh; display: flex; align-items: center; justify-content: center; }
  .screen {
    width: 100%; max-width: 900px; height: 100%; max-height: 100vh;
    padding: 20px; display: flex; flex-direction: column; align-items: center;
    overflow-y: auto;
  }
  h1 { font-size: clamp(2rem, 6vw, 3.5rem); color: #6A4C93; text-shadow: 3px 3px 0 #fff; margin: 10px 0; text-align: center; }
  h2 { font-size: clamp(1.3rem, 4vw, 2rem); color: #2E86AB; text-align: center; margin: 10px 0; }
  h3 { font-size: clamp(1.1rem, 3vw, 1.5rem); color: #444; text-align: center; margin: 8px 0; }
  p { line-height: 1.5; }

  .big-btn {
    font-family: inherit; font-weight: bold;
    font-size: clamp(1.2rem, 3vw, 1.8rem);
    padding: 18px 32px;
    border: 4px solid #fff; border-radius: 24px;
    cursor: pointer; color: white;
    background: #6A4C93;
    box-shadow: 0 6px 0 #3f2b5a, 0 8px 16px rgba(0,0,0,0.2);
    transition: transform 0.1s, box-shadow 0.1s;
    margin: 8px;
  }
  .big-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #3f2b5a, 0 4px 8px rgba(0,0,0,0.2); }
  .big-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }
  .big-btn.green  { background: #4CAF50; box-shadow: 0 6px 0 #2e7031, 0 8px 16px rgba(0,0,0,0.2); }
  .big-btn.green:active  { box-shadow: 0 2px 0 #2e7031, 0 4px 8px rgba(0,0,0,0.2); }
  .big-btn.red    { background: #E74C3C; box-shadow: 0 6px 0 #952d22, 0 8px 16px rgba(0,0,0,0.2); }
  .big-btn.red:active    { box-shadow: 0 2px 0 #952d22, 0 4px 8px rgba(0,0,0,0.2); }
  .big-btn.orange { background: #FF8C42; box-shadow: 0 6px 0 #b35a1f, 0 8px 16px rgba(0,0,0,0.2); }
  .big-btn.orange:active { box-shadow: 0 2px 0 #b35a1f, 0 4px 8px rgba(0,0,0,0.2); }
  .big-btn.blue   { background: #2E86AB; box-shadow: 0 6px 0 #1c5670, 0 8px 16px rgba(0,0,0,0.2); }
  .big-btn.blue:active   { box-shadow: 0 2px 0 #1c5670, 0 4px 8px rgba(0,0,0,0.2); }
  .big-btn.gray   { background: #888;    box-shadow: 0 6px 0 #555,    0 8px 16px rgba(0,0,0,0.2); font-size: 1rem; padding: 10px 18px; }
  .big-btn.gray:active   { box-shadow: 0 2px 0 #555,    0 4px 8px rgba(0,0,0,0.2); }

  .top-bar {
    width: 100%; display: flex; justify-content: space-between; align-items: center;
    padding: 10px 16px; background: rgba(255,255,255,0.75); border-radius: 16px;
    margin-bottom: 12px; max-width: 900px; gap: 8px;
  }
  .top-bar .info { font-size: 1.1rem; font-weight: bold; color: #333; }
  .streak { color: #FF8C42; }

  .card {
    background: white; border-radius: 28px; padding: 24px; margin: 12px 0;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    width: 100%; max-width: 760px;
  }

  .detective {
    font-size: clamp(4rem, 12vw, 7rem);
    animation: bounce 2s ease-in-out infinite;
    display: inline-block;
  }
  .detective.thinking { animation: think 1.5s ease-in-out infinite; }
  .detective.reveal { animation: pop 0.6s ease-out; }
  @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
  @keyframes think  { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
  @keyframes pop    { 0% { transform: scale(0.3); opacity: 0; } 70% { transform: scale(1.2); } 100% { transform: scale(1); opacity: 1; } }

  .speech-bubble {
    background: white; border-radius: 24px; padding: 20px 24px; margin: 16px 0;
    position: relative; box-shadow: 0 6px 16px rgba(0,0,0,0.12);
    font-size: clamp(1.2rem, 4vw, 1.8rem); color: #333;
    max-width: 720px; text-align: center; line-height: 1.4;
  }
  .speech-bubble::after {
    content: ""; position: absolute; top: -16px; left: 50%; transform: translateX(-50%);
    border-left: 16px solid transparent; border-right: 16px solid transparent;
    border-bottom: 16px solid white;
  }

  .yes-no-row {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 20px;
    margin: 24px 0; width: 100%;
  }
  .answer-btn {
    font-family: inherit; font-weight: bold;
    font-size: clamp(1.5rem, 5vw, 2.4rem);
    padding: 24px 40px; min-width: 180px;
    border: 5px solid #fff; border-radius: 28px;
    cursor: pointer; color: white;
    box-shadow: 0 8px 0 rgba(0,0,0,0.3), 0 10px 20px rgba(0,0,0,0.2);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .answer-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 rgba(0,0,0,0.3), 0 4px 10px rgba(0,0,0,0.2); }
  .answer-yes { background: #4CAF50; }
  .answer-no  { background: #E74C3C; }
  .answer-maybe { background: #FFB347; font-size: clamp(1.1rem, 3vw, 1.4rem); padding: 16px 28px; min-width: 140px; }

  .guess-animal {
    font-size: clamp(5rem, 18vw, 10rem);
    margin: 20px 0;
    animation: pop 0.8s ease-out;
  }
  .guess-name {
    font-size: clamp(2rem, 6vw, 3.2rem);
    color: #6A4C93;
    font-weight: bold;
    margin: 10px 0;
    text-shadow: 2px 2px 0 #fff;
  }

  .thumb-row {
    display: flex; gap: 30px; justify-content: center; margin: 20px 0;
  }
  .thumb-btn {
    font-size: clamp(3rem, 9vw, 5rem);
    padding: 18px 28px;
    border: 5px solid #fff; border-radius: 30px;
    cursor: pointer; background: white;
    box-shadow: 0 6px 0 #ccc, 0 8px 16px rgba(0,0,0,0.2);
    transition: transform 0.1s;
  }
  .thumb-btn:active { transform: translateY(4px); }
  .thumb-btn.up { background: #C8E6C9; }
  .thumb-btn.down { background: #FFCDD2; }

  .fact-card {
    background: #FFF8E7; border: 3px dashed #FFB347;
    border-radius: 20px; padding: 18px; margin: 16px 0;
    font-size: clamp(1rem, 3vw, 1.3rem); color: #555;
    line-height: 1.5; text-align: center;
  }
  .fact-card .fact-label { font-weight: bold; color: #FF8C42; display: block; margin-bottom: 6px; }

  .album-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
    gap: 12px; width: 100%; margin-top: 16px;
  }
  .sticker {
    background: white; border-radius: 18px; padding: 12px 6px;
    text-align: center; border: 3px solid #FFB347;
    box-shadow: 0 4px 0 rgba(0,0,0,0.1);
    transition: transform 0.15s;
  }
  .sticker:active { transform: scale(0.95); }
  .sticker.locked { opacity: 0.25; filter: grayscale(1); }
  .sticker-emoji { font-size: clamp(2rem, 5vw, 2.8rem); }
  .sticker-name  { font-size: 0.8rem; color: #555; margin-top: 4px; font-weight: bold; }

  .animal-picker {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 12px; width: 100%; max-width: 720px; margin: 16px 0;
    max-height: 50vh; overflow-y: auto; padding: 6px;
  }
  .picker-tile {
    background: white; border-radius: 18px; padding: 14px 6px;
    text-align: center; border: 4px solid #fff;
    box-shadow: 0 4px 0 rgba(0,0,0,0.12);
    cursor: pointer; transition: transform 0.15s, border-color 0.2s;
  }
  .picker-tile:active { transform: scale(0.95); }
  .picker-tile:hover { border-color: #6A4C93; }
  .picker-emoji { font-size: clamp(2rem, 5vw, 3rem); }
  .picker-name  { font-size: 0.95rem; color: #333; margin-top: 4px; font-weight: bold; }

  input[type=text] {
    font-family: inherit;
    font-size: 1.3rem;
    padding: 14px 18px;
    border: 4px solid #6A4C93;
    border-radius: 18px;
    width: 100%; max-width: 360px;
    margin: 10px;
    text-align: center;
  }

  .progress-dots {
    display: flex; gap: 8px; justify-content: center; margin: 12px 0;
  }
  .dot {
    width: 16px; height: 16px; border-radius: 50%;
    background: rgba(255,255,255,0.6);
    border: 2px solid #6A4C93;
  }
  .dot.filled { background: #6A4C93; }

  .stat-row {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px; width: 100%; margin: 14px 0;
  }
  .stat-box {
    background: #F5F3FF; border-radius: 18px; padding: 16px; text-align: center;
    border: 3px solid #6A4C93;
  }
  .stat-num { font-size: 2rem; font-weight: bold; color: #6A4C93; }
  .stat-label { font-size: 0.95rem; color: #555; }

  .stumped-list {
    list-style: none; padding: 0; margin: 10px 0;
    display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
  }
  .stumped-list li {
    background: #FFE4E1; border: 2px solid #E74C3C;
    border-radius: 14px; padding: 8px 14px; font-weight: bold;
    color: #952d22;
  }

  .hidden { display: none !important; }

  .confetti {
    position: fixed; pointer-events: none; top: -20px;
    font-size: 2rem; animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); opacity: 0.6; }
  }

  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-thumb { background: #6A4C93; border-radius: 10px; }
  ::-webkit-scrollbar-track { background: rgba(255,255,255,0.4); }
</style>
</head>
<body>
<div id="app"></div>

<script>

// ============================================================

// Designed for ~5-8 questions per path
// ============================================================

          no:  { animal: "fish" }

  no: {

    yes: {

      yes: {
        q: "Does it have colorful wings?",
        yes: { animal: "butterfly" },
        no: {
          q: "Does it make honey?",

              }
            }
          },
          no: {

            yes: {

// ============================================================
// STATE / STORAGE
// ============================================================
const LS_KEY = "animalQuizDetective_v1";
const defaultState = () => ({
  streak: 0,
  bestStreak: 0,
  gamesPlayed: 0,
  correctGuesses: 0,
  album: {},       // { animalKey: true }
  stumped: {},     // { animalName: count }
});
function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return defaultState();
    return Object.assign(defaultState(), JSON.parse(raw));
  } catch { return defaultState(); }
}
function saveState() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch {}
}
let state = loadState();

// Current game state
let currentNode = null;
let questionCount = 0;
let lastGuessKey = null;

// ============================================================
// SPEECH (Web Speech API with graceful fallback)
// ============================================================
let speechAvailable = false;
try { speechAvailable = ('speechSynthesis' in window); } catch {}

function speak(text) {
  if (!speechAvailable) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.95;
    u.pitch = 1.15;
    u.volume = 1.0;
    window.speechSynthesis.speak(u);
  } catch {}
}
function stopSpeak() {
  if (!speechAvailable) return;
  try { window.speechSynthesis.cancel(); } catch {}
}

// ============================================================
// CONFETTI
// ============================================================
function confetti() {
  const emojis = ["🎉", "⭐", "✨", "🎊", "💫", "🌟"];
  for (let i = 0; i < 24; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    c.style.left = Math.random() * 100 + "vw";
    c.style.animationDuration = (1.5 + Math.random() * 2) + "s";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4000);
  }
}

// ============================================================
// SCREENS
// ============================================================
const app = document.getElementById("app");

function topBar(extraHtml = "") {
  return `
    <div class="top-bar">
      <div class="info">🔥 Streak: <span class="streak">${state.streak}</span></div>
      <div class="info">🏆 Best: ${state.bestStreak}</div>
      ${extraHtml}
      <button class="big-btn gray" onclick="showHome()">🏠 Home</button>
    </div>`;
}

function showHome() {
  stopSpeak();
  const totalAnimals = Object.keys(ANIMALS).length;
  const collected = Object.keys(state.album).length;
  app.innerHTML = `
    <div class="screen">
      <h1>🕵️ Animal Quiz Detective</h1>
      <div style="text-align:center; margin: 10px 0;">
        <div class="detective">🕵️</div>
      </div>
      <div class="speech-bubble">
        Think of an animal in your head…<br>
        I'll guess what it is by asking questions!
      </div>
      <button class="big-btn green" onclick="startGame()">▶️ Start Game</button>
      <div style="display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-top: 16px;">
        <button class="big-btn blue" onclick="showAlbum()">📒 My Album (${collected}/${totalAnimals})</button>
        <button class="big-btn orange" onclick="showDashboard()">👨‍👩‍👧 For Grown-Ups</button>
      </div>
      <p style="margin-top:18px; text-align:center; color:#555; font-size:0.95rem;">
        Tap big <span style="color:#4CAF50;font-weight:bold;">YES</span> or <span style="color:#E74C3C;font-weight:bold;">NO</span> buttons to answer the Detective's questions.
      </p>
    </div>`;
}

function startGame() {
  currentNode = TREE;
  questionCount = 0;
  lastGuessKey = null;
  renderGame();
  setTimeout(() => speak("Think of an animal! I will try to guess it."), 250);
}

function renderGame() {
  if (currentNode.animal) {
    renderGuess(currentNode.animal);
    return;
  }
  questionCount++;
  const qText = currentNode.q;
  app.innerHTML = `
    <div class="screen">
      ${topBar()}
      <div style="text-align:center;">
        <div class="detective thinking">🕵️</div>
      </div>
      <div class="speech-bubble">${qText}</div>
      <div class="progress-dots">
        ${Array.from({length: 8}, (_, i) =>
          `<div class="dot${i < questionCount ? ' filled' : ''}"></div>`
        ).join('')}
      </div>
      <div class="yes-no-row">
        <button class="answer-btn answer-yes" onclick="answerQuestion(true)">✅ YES</button>
        <button class="answer-btn answer-no" onclick="answerQuestion(false)">❌ NO</button>
      </div>
      <div style="text-align:center; margin-top:10px;">
        <button class="big-btn gray" onclick="speak(${JSON.stringify(qText)})">🔊 Say it again</button>
      </div>
    </div>`;
  setTimeout(() => speak(qText), 200);
}

function answerQuestion(yes) {
  if (!currentNode) return;
  const next = yes ? currentNode.yes : currentNode.no;
  if (!next) {
    // Safety: shouldn't happen with our tree
    renderGuess("dog");
    return;
  }
  currentNode = next;
  renderGame();
}

function renderGuess(animalKey) {
  const a = ANIMALS[animalKey] || ANIMALS.dog;
  lastGuessKey = animalKey;
  // Add to album (we encountered it)
  state.album[animalKey] = true;
  saveState();
  app.innerHTML = `
    <div class="screen">
      ${topBar()}
      <div style="text-align:center;">
        <div class="detective reveal">🕵️</div>
      </div>
      <div class="speech-bubble">I think I know! Is it a…</div>
      <div style="text-align:center;">
        <div class="guess-animal">${a.emoji}</div>
        <div class="guess-name">${a.name.toUpperCase()}?!</div>
      </div>
      <h3>Did I get it right?</h3>
      <div class="thumb-row">
        <button class="thumb-btn up"   onclick="answerGuess(true)">👍</button>
        <button class="thumb-btn down" onclick="answerGuess(false)">👎</button>
      </div>
    </div>`;
  setTimeout(() => speak(`Is it a ${a.name}?`), 250);
}

function answerGuess(correct) {
  state.gamesPlayed++;
  if (correct) {
    state.correctGuesses++;
    state.streak++;
    if (state.streak > state.bestStreak) state.bestStreak = state.streak;
    saveState();
    showCelebrate(lastGuessKey);
  } else {
    state.streak = 0;
    saveState();
    showStumped();
  }
}

function showCelebrate(animalKey) {
  const a = ANIMALS[animalKey];
  confetti();
  app.innerHTML = `
    <div class="screen">
      ${topBar()}
      <div style="text-align:center;">
        <div class="detective reveal">🕵️</div>
      </div>
      <div class="speech-bubble">🎉 I got it! Yay!</div>
      <div style="text-align:center;">
        <div class="guess-animal">${a.emoji}</div>
        <div class="guess-name">${a.name}</div>
      </div>
      <div class="fact-card">
        <span class="fact-label">⭐ Fun Fact</span>
        ${a.fact}
      </div>
      <div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center;">
        <button class="big-btn green" onclick="startGame()">▶️ Play Again</button>
        <button class="big-btn blue" onclick="showAlbum()">📒 My Album</button>
      </div>
    </div>`;
  setTimeout(() => speak(`Yes! I got it! It was a ${a.name}. ${a.fact}`), 400);
}

function showStumped() {
  app.innerHTML = `
    <div class="screen">
      ${topBar()}
      <div style="text-align:center;">
        <div class="detective">🕵️</div>
      </div>
      <div class="speech-bubble">Oh no, you stumped me! 🤔<br>What was your animal?</div>
      <input type="text" id="realAnimal" placeholder="Type the animal name…" maxlength="30">
      <div>
        <button class="big-btn green" onclick="submitStumped()">Tell me!</button>
      </div>
      <h3 style="margin-top:18px;">…or pick one:</h3>
      <div class="animal-picker" id="picker"></div>
      <button class="big-btn gray" onclick="skipStumped()">Skip</button>
    </div>`;
  // Build picker from animals NOT in album, then any
  const picker = document.getElementById("picker");
  const keys = Object.keys(ANIMALS).sort((a, b) =>
    ANIMALS[a].name.localeCompare(ANIMALS[b].name)
  );
  keys.forEach(k => {
    const a = ANIMALS[k];
    const tile = document.createElement("div");
    tile.className = "picker-tile";
    tile.innerHTML = `<div class="picker-emoji">${a.emoji}</div><div class="picker-name">${a.name}</div>`;
    tile.onclick = () => pickStumped(k);
    picker.appendChild(tile);
  });
  setTimeout(() => speak("Oh no, you stumped me! What was your animal?"), 300);
}

function submitStumped() {
  const inp = document.getElementById("realAnimal");
  const val = (inp.value || "").trim();
  if (!val) return;
  recordStumped(val);
  // Check if it matches a known animal
  const match = Object.keys(ANIMALS).find(k =>
    ANIMALS[k].name.toLowerCase() === val.toLowerCase()
  );
  if (match) { showFactForReal(match); }
  else { showThanksStumped(val); }
}

function pickStumped(animalKey) {
  const a = ANIMALS[animalKey];
  recordStumped(a.name);
  state.album[animalKey] = true;
  saveState();
  showFactForReal(animalKey);
}

function skipStumped() {
  showHome();
}

function recordStumped(name) {
  const key = name.toLowerCase();
  state.stumped[key] = (state.stumped[key] || 0) + 1;
  saveState();
}

function showFactForReal(animalKey) {
  const a = ANIMALS[animalKey];
  app.innerHTML = `
    <div class="screen">
      ${topBar()}
      <div style="text-align:center;">
        <div class="detective">🕵️</div>
      </div>
      <div class="speech-bubble">Ohh, a ${a.name}! I'll remember that next time.</div>
      <div style="text-align:center;">
        <div class="guess-animal">${a.emoji}</div>
        <div class="guess-name">${a.name}</div>
      </div>
      <div class="fact-card">
        <span class="fact-label">⭐ Fun Fact</span>
        ${a.fact}
      </div>
      <button class="big-btn green" onclick="startGame()">▶️ Play Again</button>
    </div>`;
  setTimeout(() => speak(`Ohh, a ${a.name}! ${a.fact}`), 300);
}

function showThanksStumped(name) {
  app.innerHTML = `
    <div class="screen">
      ${topBar()}
      <div style="text-align:center;">
        <div class="detective">🕵️</div>
      </div>
      <div class="speech-bubble">Wow, a ${escapeHtml(name)}! I'll have to learn about that one. Thanks!</div>
      <button class="big-btn green" onclick="startGame()">▶️ Play Again</button>
    </div>`;
  setTimeout(() => speak(`Wow, a ${name}! I will have to learn about that one.`), 300);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c]);
}

// ============================================================
// ALBUM
// ============================================================
function showAlbum() {
  stopSpeak();
  const keys = Object.keys(ANIMALS).sort((a, b) =>
    ANIMALS[a].name.localeCompare(ANIMALS[b].name)
  );
  const collected = Object.keys(state.album).length;
  app.innerHTML = `
    <div class="screen">
      ${topBar()}
      <h1>📒 My Animal Album</h1>
      <h3>${collected} of ${keys.length} collected!</h3>
      <div class="album-grid">
        ${keys.map(k => {
          const a = ANIMALS[k];
          const got = !!state.album[k];
          return `<div class="sticker ${got ? '' : 'locked'}" title="${a.name}">
            <div class="sticker-emoji">${got ? a.emoji : '❓'}</div>
            <div class="sticker-name">${got ? a.name : '???'}</div>
          </div>`;
        }).join('')}
      </div>
      <button class="big-btn green" style="margin-top:18px;" onclick="startGame()">▶️ Play Again</button>
    </div>`;
}

// ============================================================
// DASHBOARD (parents)
// ============================================================
function showDashboard() {
  stopSpeak();
  const accuracy = state.gamesPlayed > 0
    ? Math.round((state.correctGuesses / state.gamesPlayed) * 100)
    : 0;
  const stumpedEntries = Object.entries(state.stumped)
    .sort((a, b) => b[1] - a[1]);
  app.innerHTML = `
    <div class="screen">
      ${topBar()}
      <h1>👨‍👩‍👧 For Grown-Ups</h1>
      <div class="card">
        <h2>📊 Detective Stats</h2>
        <div class="stat-row">
          <div class="stat-box"><div class="stat-num">${state.gamesPlayed}</div><div class="stat-label">Games played</div></div>
          <div class="stat-box"><div class="stat-num">${state.correctGuesses}</div><div class="stat-label">Correct guesses</div></div>
          <div class="stat-box"><div class="stat-num">${accuracy}%</div><div class="stat-label">Detective accuracy</div></div>
          <div class="stat-box"><div class="stat-num">${state.bestStreak}</div><div class="stat-label">Best streak</div></div>
          <div class="stat-box"><div class="stat-num">${Object.keys(state.album).length}</div><div class="stat-label">Animals in album</div></div>
        </div>
      </div>
      <div class="card">
        <h2>🎯 Animals That Stumped the Detective</h2>
        ${stumpedEntries.length === 0
          ? `<p style="text-align:center;color:#777;">None yet! The Detective is on a roll.</p>`
          : `<ul class="stumped-list">
              ${stumpedEntries.map(([name, count]) =>
                `<li>${escapeHtml(name)}${count > 1 ? ` ×${count}` : ''}</li>`
              ).join('')}
            </ul>`
        }
      </div>
      <div class="card">
        <h2>💡 Talking Points</h2>
        <p style="color:#444; line-height:1.6;">
          Ask your kid: <em>"How did the Detective know your animal? What questions helped the most?"</em><br><br>
          This game is a gentle intro to how AI works — by asking yes/no questions and narrowing down possibilities,
          just like a flowchart in your head. Real AI uses millions of these tiny decisions!
        </p>
      </div>
      <button class="big-btn red" onclick="resetData()">🗑️ Reset All Data</button>
    </div>`;
}

function resetData() {
  if (!confirm("Reset all stats, streak, album, and stumped list?")) return;
  state = defaultState();
  saveState();
  showHome();
}

// ============================================================
// INIT
// ============================================================
window.showHome = showHome;
window.startGame = startGame;
window.answerQuestion = answerQuestion;
window.answerGuess = answerGuess;
window.submitStumped = submitStumped;
window.pickStumped = pickStumped;
window.skipStumped = skipStumped;
window.showAlbum = showAlbum;
window.showDashboard = showDashboard;
window.resetData = resetData;
window.speak = speak;

showHome();
</script>
</body>
</html>
